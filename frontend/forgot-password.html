<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quên Mật Khẩu - Hệ Thống Điểm Danh</title>
    <style>
        :root {
            --bg-start: #f0f7ff;
            --bg-end: #dfe9ff;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --card-bg: rgba(255, 255, 255, 0.87);
            --text: #0f172a;
            --muted: #64748b;
            --border: rgba(148, 163, 184, 0.35);
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
        }

        .card {
            background: var(--card-bg);
            padding: 36px 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 16px 36px rgba(15, 23, 42, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        h2 {
            color: var(--text);
            text-align: center;
            margin: 0 0 10px;
            font-size: 24px;
        }

        .desc {
            font-size: 13px;
            color: var(--muted);
            text-align: center;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        input[type="email"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            background: white;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="email"]:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            transition: transform 0.2s, filter 0.2s;
        }

        button:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
        }

        .message {
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
            padding: 10px;
            border-radius: 8px;
            display: none;
            line-height: 1.4;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: var(--primary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Khôi Phục Mật Khẩu</h2>
        <div class="desc">Nhập địa chỉ email đăng ký để nhận liên kết đặt lại mật khẩu an toàn.</div>
        
        <form id="forgotForm">
            <div class="form-group">
                <label for="email">Địa chỉ Email</label>
                <input type="email" id="email" autocomplete="email" maxlength="254" required placeholder="vidu@student.edu.vn">
            </div>
            <button type="submit" id="btnSubmit">Gửi Liên Kết Đặt Lại Mật Khẩu</button>
        </form>

        <div id="message" class="message" role="status"></div>
        <a href="login.html" class="back-link">← Quay lại trang Đăng nhập</a>
    </div>

<script>
    const forgotForm = document.getElementById('forgotForm');
    const emailInput = document.getElementById('email');
    const message = document.getElementById('message');
    const btnSubmit = document.getElementById('btnSubmit');

    const apiBaseUrl = window.location.protocol === 'file:'
        ? 'http://localhost:3000'
        : window.location.origin;

    forgotForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = emailInput.value.trim();

        if (!email) {
            message.textContent = 'Vui lòng nhập địa chỉ email.';
            message.className = 'message error';
            return;
        }

        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Đang gửi yêu cầu...';
        message.style.display = 'none';

        try {
            const response = await fetch(`${apiBaseUrl}/api/auth/forgot-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            const result = await response.json();
            message.textContent = result.message || 'Yêu cầu đặt lại mật khẩu đã được xử lý.';
            message.className = response.ok ? 'message success' : 'message error';
            message.style.display = 'block';
        } catch (error) {
            message.textContent = 'Không thể kết nối đến máy chủ. Vui lòng thử lại sau.';
            message.className = 'message error';
            message.style.display = 'block';
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'Gửi Liên Kết Đặt Lại Mật Khẩu';
        }
    });
</script>
</body>
</html>
