<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đặt Lại Mật Khẩu - Hệ Thống Điểm Danh</title>
    <style>
        :root {
            --bg-start: #101711; --bg-end: #0fa9ff; --primary: #2563eb;
            --card-bg: rgba(255, 255, 255, 0.87); --text: #111723;
        }
        body {
            margin: 0; min-height: 100vh; display: flex;
            justify-content: center; align-items: center;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background: var(--card-bg); padding: 30px; border-radius: 12px;
            width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        h2 { color: var(--text); text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: var(--text); }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { opacity: 0.9; }
        .message { margin-top: 15px; text-align: center; font-size: 14px; }
        .message.error { color: #b91c1c; }
        .message.success { color: #047857; }
        .back-link { display: block; margin-top: 15px; text-align: center; color: var(--primary); text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Đặt Lại Mật Khẩu</h2>
        <form id="resetForm">
            <div class="input-group" id="tokenGroup">
                <label for="tokenInput">Mã xác thực (Token từ email):</label>
                <input type="text" id="tokenInput" autocomplete="off" required placeholder="Nhập mã token từ email của bạn">
            </div>
            <div class="input-group">
                <label for="newPassword">Mật khẩu mới:</label>
                <input type="password" id="newPassword" autocomplete="new-password" minlength="8" maxlength="1024" required placeholder="Ít nhất 8 ký tự">
            </div>
            <div class="input-group">
                <label for="confirmPassword">Xác nhận mật khẩu mới:</label>
                <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" maxlength="1024" required placeholder="Nhập lại mật khẩu mới">
            </div>
            <button type="submit">Xác nhận đổi mật khẩu</button>
        </form>
        <div id="message" class="message" role="status"></div>
        <a href="login.html" class="back-link">← Quay lại Đăng nhập</a>
    </div>
</body>
<script>
    const resetForm = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const tokenInput = document.getElementById('tokenInput');
    const tokenGroup = document.getElementById('tokenGroup');
    const urlToken = new URLSearchParams(window.location.search).get('token');
    const apiBaseUrl = window.location.protocol === 'file:'
        ? 'http://localhost:3000'
        : window.location.origin;

    if (urlToken) {
        tokenInput.value = urlToken;
        tokenGroup.style.display = 'none'; // Đã có token trên URL, ẩn bớt để giao diện gọn gàng
        window.history.replaceState(null, '', window.location.pathname);
    }


    resetForm.addEventListener('submit', async function(event) {
        event.preventDefault();
        const token = (tokenInput ? tokenInput.value.trim() : '') || urlToken || '';
        const password = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!token) {
            message.textContent = 'Vui lòng nhập mã xác thực (Token) hoặc mở liên kết từ email.';
            message.className = 'message error';
            return;
        }

        if (password.length < 8) {
            message.textContent = 'Mật khẩu phải có ít nhất 8 ký tự.';
            message.className = 'message error';
            return;
        }
        if (password !== confirmPassword) {
            message.textContent = 'Mật khẩu xác nhận không khớp.';
            message.className = 'message error';
            return;
        }

        try {
            const response = await fetch(`${apiBaseUrl}/api/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, password })
            });
            const result = await response.json();
            message.textContent = result.message;
            message.className = result.success ? 'message success' : 'message error';
            if (result.success) {
                resetForm.reset();
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
            }
        } catch (error) {
            if (window.location.protocol === 'file:') {
                message.textContent = 'Bạn đang mở file trực tiếp. Hãy chạy "npm start" rồi mở http://localhost:3000/reset-password.html';
            } else {
                message.textContent = 'Không thể kết nối đến máy chủ.';
            }
            message.className = 'message error';
        }
    });
</script>
</html>
