<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vai trò - DNKN</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="roles">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content">
        <div class="toolbar">
          <div class="left"><h3 style="margin:0">Danh sách vai trò</h3></div>
          <div class="right"><button class="btn primary" id="btnAdd">＋ Thêm vai trò</button></div>
        </div>
        <div class="card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Tên vai trò</th><th>Mã</th><th>Mô tả</th><th>Người dùng</th><th>Loại</th><th style="text-align:right">Hành động</th></tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/roles.js"></script>
</body>
</html>
