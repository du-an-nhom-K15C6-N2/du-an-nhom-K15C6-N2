<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập - DNKN</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="logo">🛡️</div>
    <h1>DNKN - Quản lý vai trò</h1>
    <p class="sub">Đăng nhập để gán / thu hồi vai trò người dùng</p>
    <div class="login-err" id="loginErr"></div>
    <form id="loginForm">
      <div class="field">
        <label>Tên đăng nhập</label>
        <input class="input" id="username" placeholder="Tên đăng nhập" autocomplete="username" />
      </div>
      <div class="field">
        <label>Mật khẩu</label>
        <input class="input" type="password" id="password" placeholder="Mật khẩu" autocomplete="current-password" />
      </div>
      <button class="btn primary" style="width:100%;justify-content:center;padding:12px" type="submit">Đăng nhập</button>
    </form>
    <div class="login-hint">
      <b>Quản trị:</b> admin / admin123<br />
      <b>Giảng viên + QLĐT:</b> linh / 123456
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
