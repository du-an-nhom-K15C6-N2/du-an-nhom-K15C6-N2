<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quên Mật Khẩu - Hệ Thống Điểm Danh</title>
    <style>
        :root {
            --bg-start: #101711;
            --bg-end: #0fa9ff;
            --primary: #2563eb;
            --card-bg: rgba(255, 255, 255, 0.87);
            --text: #111723;
        }
        body {
            margin: 0; min-height: 100vh; display: flex;
            justify-content: center; align-items: center;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background: var(--card-bg); padding: 30px; border-radius: 12px;
            width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        h2 { color: var(--text); text-align: center; margin-bottom: 20px; }
        .hint { color: #475569; font-size: 13px; line-height: 1.5; margin: -8px 0 18px; text-align: center; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: var(--text); }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:disabled { opacity: 0.65; cursor: wait; }
        .message { margin-top: 15px; text-align: center; font-size: 14px; color: #047857; }
        button:hover { opacity: 0.9; }
        .back-link { text-align: center; margin-top: 15px; }
        .back-link a { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Quên Mật Khẩu</h2>
        <p class="hint">Nhập email đã đăng ký. Liên kết đặt lại có hiệu lực trong 30 phút.</p>
        <form id="forgotForm">
            <div class="input-group">
                <label for="email">Nhập email đăng ký của bạn:</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <button type="submit">Gửi liên kết đặt lại</button>
        </form>
        <div id="message" class="message" role="status"></div>
        <div class="back-link">
            <a href="login.html">Quay lại đăng nhập</a>
        </div>
    </div>
</body>
<!-- Đặt đoạn script này trước thẻ đóng </body> trong forgot-password.html -->
    <script>
        const apiBaseUrl = window.location.protocol === 'file:'
            ? 'http://localhost:3000'
            : window.location.origin;

        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const form = this;
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('message');
            const submitButton = form.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            message.textContent = 'Đang gửi liên kết...';
            message.style.color = '#047857';

            try {
                const response = await fetch(`${apiBaseUrl}/api/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const result = await response.json();

                message.textContent = result.message;
                message.style.color = result.success ? '#047857' : '#b91c1c';
                if (result.success) form.reset();
            } catch (error) {
                console.error('Lỗi kết nối:', error);
                if (window.location.protocol === 'file:') {
                    message.textContent = 'Bạn đang mở file trực tiếp. Hãy chạy "npm start" rồi mở http://localhost:3000/forgot-password.html';
                } else {
                    message.textContent = 'Không thể kết nối đến máy chủ. Vui lòng kiểm tra lại server backend!';
                }
                message.style.color = '#b91c1c';
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</html>
