<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập - Hệ Thống Điểm Danh</title>
    <style>
        :root {
            --bg-start: #f0f7ff;
            --bg-end: #dfe9ff;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-soft: #e0ecff;
            --card-bg: rgba(255, 255, 255, 0.82);
            --text: #0f172a;
            --muted: #64748b;
            --border: rgba(148, 163, 184, 0.35);
            --danger-bg: #fee2e2;
            --danger-text: #991b1b;
            --success: #10b981;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            position: relative;
            overflow: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.08);
            filter: blur(12px);
        }

        body::before {
            top: -120px;
            left: -80px;
        }

        body::after {
            right: -60px;
            bottom: -140px;
        }

        .login-card {
            position: relative;
            z-index: 1;
            width: min(92vw, 420px);
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
            border-radius: 24px;
            padding: 36px 30px 28px;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .brand-mark {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--primary) 0%, #60a5fa 100%);
            color: white;
            font-size: 24px;
            box-shadow: 0 12px 25px rgba(37, 99, 235, 0.28);
        }

        h2 {
            margin: 0;
            color: var(--text);
            font-size: 28px;
            letter-spacing: -0.03em;
            text-align: center;
        }

        .desc {
            margin: 8px 0 22px;
            font-size: 13px;
            color: var(--muted);
            text-align: center;
            letter-spacing: 0.02em;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-bottom: 20px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.08);
            color: #0f766e;
            font-size: 12px;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 5px rgba(16, 185, 129, 0.15);
        }

        .alert-timeout {
            background: var(--danger-bg);
            color: var(--danger-text);
            padding: 11px 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 18px;
            text-align: center;
            display: none;
            border: 1px solid rgba(153, 27, 27, 0.08);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap input {
            width: 100%;
            padding: 13px 14px 13px 42px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.8);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        .input-wrap input:focus {
            border-color: rgba(37, 99, 235, 0.8);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
            transform: translateY(-1px);
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
        }

        .row-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0 22px;
            font-size: 12px;
        }

        .remember {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
        }

        .remember input {
            accent-color: var(--primary);
        }

        .forgot-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.24);
        }

        .btn-login:hover {
            transform: translateY(-1px);
            filter: brightness(1.03);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .footer-note {
            margin-top: 18px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px 22px;
                border-radius: 20px;
            }

            h2 {
                font-size: 24px;
            }

            .row-actions {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand">
        <div class="brand-mark">✓</div>
        <h2>Cổng Điểm Danh</h2>
    </div>
    <div class="desc">Đăng nhập an toàn</div>
    <div class="status-chip"><span class="status-dot"></span> Hệ thống đang hoạt động</div>

    <div id="timeoutAlert" class="alert-timeout">⚠️ Phiên làm việc đã hết hạn. Vui lòng đăng nhập lại!</div>

    <div class="form-group">
        <label>Tài khoản / Mã sinh viên</label>
        <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="username" value="sv_k2301">
        </div>
    </div>
    <div class="form-group">
        <label>Mật khẩu</label>
        <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" value="123456">
        </div>
    </div>

    <div class="row-actions">
        <label class="remember"><input type="checkbox" checked> Ghi nhớ tôi</label>
        <a href="#" class="forgot-link">Quên mật khẩu?</a>
    </div>

    <button class="btn-login" onclick="xuLyDangNhap()">Đăng Nhập</button>
    <div class="footer-note">Bảo mật theo chuẩn doanh nghiệp</div>
</div>

<script>
    const apiBaseUrl = window.location.protocol === "file:" ? "http://localhost:3000" : "";

    if (window.location.protocol === "file:") {
        window.location.href = "http://localhost:3000/login.html";
    }

    window.onload = function() {
        const reason = localStorage.getItem("logout_reason");
        if (reason === "timeout") {
            document.getElementById("timeoutAlert").style.display = "block";
            localStorage.removeItem("logout_reason");
        }
    };

    async function xuLyDangNhap() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (!username || !password) {
            alert("Vui lòng nhập tài khoản và mật khẩu.");
            return;
        }

        try {
            const response = await fetch(`${apiBaseUrl}/api/session/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.message || "Đăng nhập không thành công.");
            }

            localStorage.setItem("isLoggedIn", "true");
            localStorage.setItem("sessionToken", result.token);
            localStorage.setItem("sessionExpiresAt", String(result.expiresAt));
            window.location.href = `${apiBaseUrl}/index.html`;
        } catch (error) {
            alert(error.message || "Đăng nhập không thành công.");
        }
    }
</script>

</body>
</html>
